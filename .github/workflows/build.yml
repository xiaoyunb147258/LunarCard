name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --stacktrace --no-daemon
        continue-on-error: true

      - name: Locate APKs
        id: find_apk
        run: |
          echo "--- build outputs ---"
          find app/build/outputs -name "*.apk" -type f | tee apk_list.txt
          DEBUG_APK=$(find app/build/outputs -name "app-debug.apk" -type f | head -1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" LunarCard-debug.apk
            echo "debug_apk=LunarCard-debug.apk" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
          ls -lh *.apk 2>/dev/null || true

      - name: Upload Debug APK
        if: steps.find_apk.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LunarCard-debug-apk
          path: LunarCard-debug.apk
          retention-days: 90

      - name: Upload all build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/outputs/
            app/build/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: LunarCard-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
