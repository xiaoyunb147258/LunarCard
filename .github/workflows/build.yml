name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Verify sources
        run: |
          echo "=== java files ==="
          find app/src -name "*.java" | wc -l
          echo "=== build files ==="
          ls -la *.gradle gradle.properties app/build.gradle

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          if [ -n "$APK" ]; then
            cp "$APK" LunarCard.apk
            echo "found=true" >> $GITHUB_OUTPUT
            ls -lh LunarCard.apk
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK
        if: steps.apk.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LunarCard-apk
          path: LunarCard.apk
          retention-days: 90

      - name: Upload build report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-report
          path: |
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore